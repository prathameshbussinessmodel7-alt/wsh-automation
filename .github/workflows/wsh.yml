name: WSH Cloud Institutional Pipeline

on:
  schedule:
    - cron: '0 4,5,7,9,15 * * 1-5'
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-cloud-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Google Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Run WSH Extraction Script
      run: python wsh_cloud_automation.py

    - name: Commit and Push Cloud Reports
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git config --global user.name "WSH-Cloud-Bot"
        git config --global user.email "bot@whitesaltholdings.local"
        git add WSH_Automated_Reports/
        git commit -m "Auto-harvested cloud report [skip ci]" || echo "No changes to commit"
        git push origin HEAD:main
