
name: WSH Cloud Institutional Pipeline

on:
  schedule:
    - cron: '0 4,5,7,9,15 * * 1-5'
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wsh-cloud-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-cloud-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Google Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Run WSH Extraction Script
      run: python wsh_cloud_automation.py

    - name: Commit and Push Cloud Reports
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET_BRANCH: ${{ github.ref_name }}
      run: |
        set -e

        echo "Current execution branch: $TARGET_BRANCH"

        git remote set-url origin \
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        git config user.name "WSH-Cloud-Bot"
        git config user.email "bot@whitesaltholdings.local"

        git add WSH_Automated_Reports/

        if git diff --cached --quiet; then
          echo "No new cloud reports to commit."
          exit 0
        fi

        git commit -m "Auto-harvested cloud report [skip ci]"

        git fetch origin "$TARGET_BRANCH"

        git rebase "origin/$TARGET_BRANCH"

        git push origin "HEAD:$TARGET_BRANCH"

        echo "Reports successfully pushed to $TARGET_BRANCH"
