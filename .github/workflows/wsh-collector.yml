name: WSH Institutional Data Collector

on:
  workflow_dispatch:
  schedule:
    # Hourly collection; change cadence to match source terms and operational need.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: wsh-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run WSH collector
        run: python wsh_cloud_automation.py

      
        
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WSH-collector-${{ github.run_id }}
          path: WSH_Automated_Reports/
          if-no-files-found: warn
          retention-days: 30
