name: WSH Institutional Data Collector

on:
  workflow_dispatch:
  schedule:
    # Hourly collection; change cadence to match source terms and operational need.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: wsh-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run WSH collector
        run: python wsh_cloud_automation.py

      - name: Commit generated WSH evidence and packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "wsh-data-bot"
          git config user.email "wsh-data-bot@users.noreply.github.com"
          git add WSH_Automated_Reports
          if ! git diff --cached --quiet; then
            git commit -m "WSH data collection: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No generated artifact changes to commit."
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WSH-collector-${{ github.run_id }}
          path: WSH_Automated_Reports/
          if-no-files-found: warn
          retention-days: 30
