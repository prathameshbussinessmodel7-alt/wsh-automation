
name: WSH V3 Candidate Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-validation:
    name: V3 Integration, Runtime and WebSocket Identity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout R&D candidate
        uses: actions/checkout@v4
        with:
          ref: wsh-collector-rnd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 selenium requests

      - name: Verify dependencies
        run: |
          python -c "import bs4, selenium, requests; print('Dependencies PASS')"

      - name: Record candidate source fingerprint
        run: |
          sha256sum wsh_cloud_automation_isolation_manifest_candidate_v3.py | tee V3_SOURCE_SHA256.txt

      - name: Compile candidate and all tests
        run: |
          python -m py_compile \
            wsh_cloud_automation_isolation_manifest_candidate_v3.py \
            test_wsh_candidate_v3_integration.py \
            test_wsh_candidate_v3_runtime.py \
            test_wsh_v3_ws_identity_freshness.py

      - name: Run V3 integration tests
        run: |
          set -o pipefail
          python -m unittest -v test_wsh_candidate_v3_integration 2>&1 | tee V3_INTEGRATION_TEST_RESULTS.txt

      - name: Run V3 controlled runtime tests
        run: |
          set -o pipefail
          python -m unittest -v test_wsh_candidate_v3_runtime 2>&1 | tee V3_CONTROLLED_RUNTIME_TEST_RESULTS.txt

      - name: Run V3.1 WebSocket identity and freshness tests
        run: |
          set -o pipefail
          python -m unittest -v test_wsh_v3_ws_identity_freshness 2>&1 | tee V3_WS_IDENTITY_FRESHNESS_TEST_RESULTS.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WSH-V3.1-Extended-Validation-Evidence
          path: |
            V3_SOURCE_SHA256.txt
            V3_INTEGRATION_TEST_RESULTS.txt
            V3_CONTROLLED_RUNTIME_TEST_RESULTS.txt
            V3_WS_IDENTITY_FRESHNESS_TEST_RESULTS.txt
          if-no-files-found: warn
          retention-days: 30
