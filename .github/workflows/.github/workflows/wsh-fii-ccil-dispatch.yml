
name: WSH FII-DII and CCIL R&D Dispatcher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsh-fii-ccil-rnd-dispatch
  cancel-in-progress: false

jobs:
  run-isolated-fii-ccil:
    name: Run FII-DII and CCIL from R&D branch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout R&D branch only
        uses: actions/checkout@v4
        with:
          ref: wsh-collector-rnd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run isolated FII-DII and CCIL collector
        run: python wsh_fii_ccil_only.py

      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WSH-FII-CCIL-RND-${{ github.run_number }}
          path: WSH_FII_CCIL_RND/
          if-no-files-found: error
          retention-days: 14
