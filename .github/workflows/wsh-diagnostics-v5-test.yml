
name: WSH Diagnostics v5 Isolated Test

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsh-diagnostics-v5-isolated
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile diagnostic candidate only
        run: |
          python -m py_compile wsh_cloud_automation_ws_diagnostics_v5.py
          python -c "import ast, pathlib; p=pathlib.Path('wsh_cloud_automation_ws_diagnostics_v5.py'); ast.parse(p.read_text(encoding='utf-8')); print('SYNTAX_VALID:', p.name)"

      - name: Upload candidate for audit
        uses: actions/upload-artifact@v4
        with:
          name: wsh-diagnostics-v5-source-${{ github.run_id }}
          path: wsh_cloud_automation_ws_diagnostics_v5.py
          if-no-files-found: error
          retention-days: 7
