name: WSH Sensibull Decoder Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Sensibull payload decoder
        run: |
          python wsh_sensibull_ws_decoder.py "sensibull_payload (1).txt" --out-dir sensibull_decoded

      - name: Upload decoder results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsh-sensibull-decoder-results
          path: sensibull_decoded/
          if-no-files-found: warn
