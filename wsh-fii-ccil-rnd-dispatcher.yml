name: WSH FII-DII and CCIL R&D Dispatcher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsh-fii-ccil-rnd-dispatch
  cancel-in-progress: false

jobs:
  run-isolated-fii-ccil:
    name: Run isolated FII-DII and CCIL collector
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout R&D branch
        uses: actions/checkout@v4
        with:
          ref: wsh-collector-rnd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run isolated FII-DII and CCIL collector
        run: python wsh_fii_ccil_only.py

      - name: Validate freshly collected evidence
        if: always()
        run: python wsh_r7_5_2.py WSH_FII_CCIL_RND --output WSH_FII_CCIL_RND/WSH_R7_5_2_LIVE_AUDIT.json

      - name: Audit CCIL network-response evidence
        if: always()
        run: python wsh_r7_5_3.py WSH_FII_CCIL_RND --output WSH_FII_CCIL_RND/WSH_R7_5_3_NETWORK_AUDIT.json

      - name: Run R7.5.2 baseline regression tests
        if: always()
        run: python -m unittest -v test_wsh_r7_5_2.py

      - name: Run R7.5.3 network diagnostics tests
        if: always()
        run: python -m unittest -v test_wsh_r7_5_3.py

      - name: Upload isolated evidence and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WSH-FII-CCIL-RND-${{ github.run_number }}
          path: WSH_FII_CCIL_RND/
          if-no-files-found: warn
          retention-days: 14
